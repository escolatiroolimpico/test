<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contactos · EFTO | Tiro Olímpico em Almada</title>
<meta name="description" content="Contacte a Escola de Formação de Tiro Olímpico em Almada e marque a sua aula experimental. Telefone 937 693 022.">
<link rel="icon" href="imagens/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilo.css?v=2">
</head>
<body data-sem-cta>

<section class="topo-pag">
  <div class="fundo" style="background-image:url(imagens/alvos.jpg)"></div>
  <div class="wrap">
    <div class="migalhas"><a href="index.html">Início</a> / Contactos</div>
    <h1>Contactos</h1>
    <p>Fale connosco. A aula experimental é o primeiro passo.</p>
  </div>
  <div class="tricolor"></div>
</section>

<section class="sec escuro">
  <div class="wrap ct-grid">
    <div class="ct-info">
      <span class="etiqueta">Onde estamos</span>
      <h2 style="margin:12px 0 20px">Almada</h2>
      <a class="ct-item" href="tel:+351937693022"><span class="ic" style="background:var(--vermelho)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span><span><small>Telefone</small><b>+351 937 693 022</b></span></a>
      <a class="ct-item" href="mailto:escolatiroolimpico@gmail.com"><span class="ic" style="background:var(--amarelo)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span><span><small>Email</small><b>escolatiroolimpico@gmail.com</b></span></a>
      <a class="ct-item" href="https://maps.google.com/?q=Rua+Ferreira+Soares+58+2810-296+Almada" target="_blank" rel="noopener"><span class="ic" style="background:var(--verde)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span><small>Morada</small><b>Rua Ferreira Soares, 58, Lote 130<br>2810-296 Almada</b></span></a>
      <div data-mapa="https://maps.google.com/maps?q=Rua%20Ferreira%20Soares%2058%2C%202810-296%20Almada&z=15&output=embed"></div>
    </div>
    <form id="form">
      <h3>Pedido de aula experimental</h3>
      <div class="duas">
        <label>Nome<input name="nome" required placeholder="O seu nome"></label>
        <label>Telefone<input name="tel" type="tel" required placeholder="9xx xxx xxx"></label>
      </div>
      <label>Email<input name="email" type="email" placeholder="nome@exemplo.pt"></label>
      <label>Turma preferida
        <select name="turma"><option>Segunda · 19:00–20:30</option><option>Segunda · 20:30–22:00</option><option>Quarta · 19:00–20:30</option><option>Quarta · 20:30–22:00</option><option>Ainda não sei</option></select></label>
      <label>Mensagem<textarea name="msg" rows="4" placeholder="Idade, experiência anterior, dúvidas…"></textarea></label>
      <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      <label class="consent"><input type="checkbox" required> Aceito que a EFTO use estes dados para me contactar, de acordo com a <a href="privacidade.html">política de privacidade</a>.</label>
      <button class="btn btn-pri" type="submit">Enviar pedido <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p id="estadoForm" class="estado" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>

<script src="js/site.js?v=2"></script>
</body>
</html>
